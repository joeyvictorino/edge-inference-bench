# Candidate models for the sweep. All GGUF URLs were verified to answer
# HTTP 302 (LFS redirect) at huggingface.co on 2026-10-07; all MLX repos
# answered 200 on the /api/models endpoint the same day.
#
# Fields
#   id              short slug; used for results/<host>/<id>/ and models.lock
#   repo            Hugging Face repo that holds the GGUF
#   file            exact GGUF filename inside that repo
#   sha256          left empty here on purpose. scripts/fetch.sh writes the
#                   real digest of the downloaded file into models.lock.
#   mlx_equivalent  4-bit MLX conversion of the same base model, or "" if none
#
# This file is parsed by scripts/lib/modelsyaml.py (a tiny stdlib parser),
# so keep the flat "list of mappings" shape below.
models:
  - id: qwen2.5-3b-instruct-q4_k_m
    repo: Qwen/Qwen2.5-3B-Instruct-GGUF
    file: qwen2.5-3b-instruct-q4_k_m.gguf
    sha256: ""
    mlx_equivalent: mlx-community/Qwen2.5-3B-Instruct-4bit

  - id: qwen2.5-1.5b-instruct-q4_k_m
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
