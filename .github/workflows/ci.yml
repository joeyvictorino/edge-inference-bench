name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Byte-compile scripts
        run: python3 -m py_compile scripts/*.py scripts/lib/*.py
      - name: Name audit
        run: scripts/name-audit.sh
      - name: Summarize the test fixture (must not touch the README)
        run: |
          cp -r tests/fixtures/results /tmp/fixture-results
          python3 scripts/summarize.py /tmp/fixture-results --no-readme
          test -s /tmp/fixture-results/testhost/summary.md

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning
